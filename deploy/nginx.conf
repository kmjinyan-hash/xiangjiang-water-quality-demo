# 湘江流域水质智能预警平台 —— 前端静态托管（nginx）
#
# 职责只有两件：
#   1. 发 dist/ 里的纯静态文件（不经过任何后端逻辑）；
#   2. 把 /api/* 反代到后端容器，让前端与接口**同源**。
#
# 同源之后：不需要 CORS 白名单，cookie 也能正常带（token 方式仍保留兼容）。
#
# 热更新：这个文件不关心页面从哪来。开发时把宿主的构建产物
# 挂到 /usr/share/nginx/html（见 docs/容器与热更新.md），nginx 直接读盘，
# 改完刷新即可；生产才把产物烤进镜像。

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 静态资源：带指纹的 ?v=xxx 可以长缓存；index.html 必须每次校验，
    # 否则用户会一直拿到旧页面（前端资源都靠它引）。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理台（dist/admin/ 由同一份产物提供）
    location /admin/ {
        return 308 /;
    }

    # ── API 反代 ──
    location /api/ {
        proxy_pass         http://wq:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # AI 报告是 SSE 流式：必须关掉缓冲，否则浏览器要等全部生成完才看到字
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 上传体积（导入 xlsx 等）；小站点不需要更大
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
